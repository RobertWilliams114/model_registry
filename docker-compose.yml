services:
  postgres: 
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "registry", "-d", "registry"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ~/.aws:/root/.aws:ro
    command: ["uvicorn", "registry.main:app", "--host", "0.0.0.0", "--reload"]
    depends_on: 
      postgres:
        condition: service_healthy
