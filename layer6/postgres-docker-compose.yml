services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ~/.aws:/root/.aws:ro
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--reload"]
    depends_on: 
      - postgres
